syntax = "proto2";

package widevine;

option csharp_namespace = "BBDown.DRM.Proto";

// Widevine 许可证协议消息，字段编号与协议标准一致，用于与 B 站 license 服务器编解码。
// 只声明本插件用到的字段：proto2 对未知字段跳过不解，多余字段不声明不影响解析。

message WidevineCencHeader
{
    enum Algorithm
    {
        UNENCRYPTED = 0;
        AESCTR = 1;
    }

    optional Algorithm algorithm = 1 [deprecated = true];
    repeated bytes key_ids = 2;
    optional bytes content_id = 4;
    optional uint32 protection_scheme = 9;
}

enum LicenseType
{
    STREAMING = 1;
    OFFLINE = 2;
    AUTOMATIC = 3;
}

enum ProtocolVersion
{
    VERSION_2_0 = 20;
    VERSION_2_1 = 21;
    VERSION_2_2 = 22;
}

message ClientIdentification
{
    enum TokenType
    {
        KEYBOX = 0;
        DRM_DEVICE_CERTIFICATE = 1;
    }

    optional TokenType type = 1 [default = KEYBOX];
    optional bytes token = 2;
    repeated NameValue client_info = 3;
    optional bytes provider_client_token = 4;
    optional uint32 license_counter = 5;
    optional ClientCapabilities client_capabilities = 6;
    optional bytes vmp_data = 7;
    repeated ClientCredentials device_credentials = 8;

    message NameValue
    {
        optional string name = 1;
        optional string value = 2;
    }

    message ClientCapabilities
    {
        optional bool client_token = 1 [default = false];
        optional bool session_token = 2 [default = false];
        optional uint32 oem_crypto_api_version = 5;
        optional bool anti_rollback_usage_table = 6 [default = false];
        optional bool can_update_srm = 8 [default = false];
    }

    message ClientCredentials
    {
        optional TokenType type = 1 [default = KEYBOX];
        optional bytes token = 2;
    }
}

message LicenseRequest
{
    message ContentIdentification
    {
        message WidevinePsshData
        {
            repeated bytes pssh_data = 1;
            optional LicenseType license_type = 2;
            optional bytes request_id = 3;
        }

        optional WidevinePsshData widevine_pssh_data = 1;
    }

    enum RequestType
    {
        NEW = 1;
        RENEWAL = 2;
        RELEASE = 3;
    }

    optional ClientIdentification client_id = 1;
    optional ContentIdentification content_id = 2;
    optional RequestType type = 3;
    optional int64 request_time = 4;
    optional ProtocolVersion protocol_version = 6 [default = VERSION_2_0];
    optional uint32 key_control_nonce = 7;
}

message SignedMessage
{
    enum MessageType
    {
        LICENSE_REQUEST = 1;
        LICENSE = 2;
        ERROR_RESPONSE = 3;
        SERVICE_CERTIFICATE_REQUEST = 4;
        SERVICE_CERTIFICATE = 5;
    }

    enum SessionKeyType
    {
        UNDEFINED = 0;
        WRAPPED_AES_KEY = 1;
        EPHERMERAL_ECC_PUBLIC_KEY = 2;
    }

    optional MessageType type = 1;
    optional bytes msg = 2;
    optional bytes signature = 3;
    optional bytes session_key = 4;
    optional SessionKeyType session_key_type = 8 [default = WRAPPED_AES_KEY];
    optional bytes oemcrypto_core_message = 9;
}

message License
{
    message KeyContainer
    {
        enum KeyType
        {
            SIGNING = 1;
            CONTENT = 2;
            KEY_CONTROL = 3;
            OPERATOR_SESSION = 4;
            ENTITLEMENT = 5;
            OEM_CONTENT = 6;
        }

        optional bytes id = 1;
        optional bytes iv = 2;
        optional bytes key = 3;
        optional KeyType type = 4;
    }

    optional LicenseIdentification id = 1;
    optional Policy policy = 2;
    repeated KeyContainer key = 3;
}

message LicenseIdentification
{
    optional bytes request_id = 1;
    optional bytes session_id = 2;
    optional bytes purchase_id = 3;
    optional LicenseType type = 4;
    optional int32 version = 5;
    optional bytes provider_session_token = 6;
}

message Policy
{
    optional bool can_play = 1 [default = false];
    optional bool can_persist = 2 [default = false];
    optional bool can_renew = 3 [default = false];
    optional int64 rental_duration_seconds = 4 [default = 0];
    optional int64 playback_duration_seconds = 5 [default = 0];
    optional int64 license_duration_seconds = 6 [default = 0];
}
