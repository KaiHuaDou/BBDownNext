<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:10; }
      .title { fill:#0f172a; font-size:16px; font-weight:700; }
      .step { fill:#0f766e; font-size:12px; font-weight:600; }
      .sub { fill:#475569; font-size:11px; }
      .branch { fill:#fef2f2; stroke:#fca5a5; }
      .branch-t { fill:#b91c1c; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect width="720" height="260" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" class="title">命令行参数解析流程</text>

  <g>
    <rect class="box" x="24"  y="84" width="130" height="60"/>
    <text x="89"  y="112" text-anchor="middle" class="step">命令行参数</text>
    <text x="89"  y="132" text-anchor="middle" class="sub">args / 子命令</text>

    <rect class="box" x="190" y="84" width="130" height="60"/>
    <text x="255" y="112" text-anchor="middle" class="step">Option 解析</text>
    <text x="255" y="132" text-anchor="middle" class="sub">CommandLineInvoker</text>

    <rect class="box" x="356" y="84" width="130" height="60"/>
    <text x="421" y="112" text-anchor="middle" class="step">MyOption</text>
    <text x="421" y="132" text-anchor="middle" class="sub">强类型配置对象</text>

    <rect class="box" x="522" y="84" width="130" height="60"/>
    <text x="587" y="112" text-anchor="middle" class="step">RunApp</text>
    <text x="587" y="132" text-anchor="middle" class="sub">任务编排</text>

    <line x1="154" y1="114" x2="186" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="320" y1="114" x2="352" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="486" y1="114" x2="518" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  </g>

  <!-- RunApp 后续分支 -->
  <g>
    <rect class="box" x="522" y="170" width="60" height="48"/>
    <text x="552" y="190" text-anchor="middle" class="sub">解析</text>
    <text x="552" y="206" text-anchor="middle" class="sub">信息</text>

    <rect class="box" x="592" y="170" width="60" height="48"/>
    <text x="622" y="190" text-anchor="middle" class="sub">下载</text>
    <text x="622" y="206" text-anchor="middle" class="sub">轨道</text>

    <rect class="box" x="662" y="170" width="48" height="48"/>
    <text x="686" y="190" text-anchor="middle" class="sub">混流</text>
    <text x="686" y="206" text-anchor="middle" class="sub">输出</text>

    <line x1="587" y1="144" x2="552" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="587" y1="144" x2="622" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="587" y1="144" x2="686" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  </g>

  <!-- 子命令分支 -->
  <g>
    <rect class="branch" x="24" y="178" width="150" height="50"/>
    <text x="99" y="200" text-anchor="middle" class="branch-t">子命令</text>
    <text x="99" y="218" text-anchor="middle" class="sub">login / logintv / serve</text>
  </g>

  <text x="24" y="250" class="sub" font-size="11" fill="#64748b">短参数示例：-v 仅视频、-a 仅音频、-s 仅字幕、-c 仅封面、-d 仅弹幕。</text>
</svg>
