name: 功能建议 / Feature Request
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想要解决什么问题？
      description: 描述当前使用中的痛点或场景，便于理解需求背景。
      placeholder: 例如：目前批量下载收藏夹时无法按 UP 主分文件夹。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 BBDown 如何支持这个功能？可以描述命令、参数或行为。
      placeholder: 例如：新增 `--group-by-owner` 参数，按 UP 主昵称创建子目录。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      description: 有没有其他可行的实现思路，或参考了其他工具的做法？
      placeholder: 例如：youtube-dl 的 %(uploader)s 变量。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何其他上下文、截图或链接。
    validations:
      required: false
