name: Build & Test

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "bilibili-API-collect/**"
      - "LiteBoard-Icon/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "bilibili-API-collect/**"
      - "LiteBoard-Icon/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  BUILD_CONFIG: Release

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Run tests with coverage
        run: dotnet test --configuration ${{ env.BUILD_CONFIG }} --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --verbosity minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          retention-days: 7

      - name: Report coverage to job summary
        if: always()
        shell: bash
        run: |
          PYCMD=$(command -v python3 || command -v python)
          "$PYCMD" - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          files = sorted(glob.glob("**/TestResults/**/coverage.cobertura.xml", recursive=True))
          lines = ["## Coverage (line-rate)"]
          if not files:
              lines.append("no coverage file found")
          for f in files:
              try:
                  rate = float(ET.parse(f).getroot().get("line-rate", "0"))
              except Exception:
                  rate = 0.0
              lines.append(f"- {f}: {rate*100:.1f}%")
          text = "\n".join(lines) + "\n"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(text)
          print(text, end="")
          PY

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    needs: [test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        shell: pwsh
        run: mv artifact/BBDown.exe artifact/BBDown-${{ matrix.rid }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}.exe
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.rid }})
    needs: [test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        run: mv artifact/BBDown artifact/BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}
          retention-days: 7

  build-linux:
    name: Build Linux (glibc) (${{ matrix.rid }})
    needs: [test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      # linux-arm64 在原生 arm64 runner 上构建，避免 x64 交叉编译需额外工具链。
      # GitHub arm64 runner 未预装 clang，且 .NET AOT 剥离符号需要 aarch64-linux-gnu-objcopy。
      - name: Cache apt archives (arm64)
        if: matrix.rid == 'linux-arm64'
        uses: actions/cache@v6
        with:
          path: ~/.apt-cache/archives
          key: apt-arm64-aot-v2-${{ hashFiles('Directory.Packages.props') }}

      - name: Install native AOT tools (arm64)
        if: matrix.rid == 'linux-arm64'
        run: |
          mkdir -p "$HOME/.apt-cache/archives"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/.apt-cache/archives" clang binutils-aarch64-linux-gnu zlib1g-dev
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.apt-cache"

      - name: Publish (AOT)
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        run: mv artifact/BBDown artifact/BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}
          retention-days: 7

  build-linux-musl:
    name: Build Linux (musl) (${{ matrix.rid }})
    needs: [test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            runner: ubuntu-latest
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # musl 目标在 Alpine 容器内按宿主架构原生编译。宿主 Ubuntu 既无 musl sysroot，
      # 其 ld.bfd 也不支持 aarch64；交叉链接要么直接失败，要么悄悄链到 glibc 产出假 musl 二进制。
      # 用 docker run 而非 job 级 container，避免 Actions runner 注入的 glibc node 在 musl 容器内跑不起来。
      # 镜像 tag 里的 alpine 版本需与 global.json 的 SDK 版本一同升级，否则 docker pull 会直接报 manifest unknown。
      - name: Resolve SDK version from global.json
        id: sdkver
        shell: bash
        run: echo "version=$(grep -m 1 -o '"version"\s*:\s*"[^"]*"' global.json | sed 's/.*:\s*"//;s/"//')" >> "$GITHUB_OUTPUT"

      - name: Cache apk packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apk
          key: apk-musl-${{ steps.sdkver.outputs.version }}

      - name: Publish (AOT in Alpine)
        run: |
          docker run --rm -v "$PWD":/src -v "$HOME/.cache/apk":/var/cache/apk -w /src \
            mcr.microsoft.com/dotnet/sdk:${{ steps.sdkver.outputs.version }}-alpine3.23 sh -c '
              apk add clang build-base zlib-dev protobuf grpc-plugins &&
              export PROTOBUF_PROTOC=/usr/bin/protoc &&
              export GRPC_PROTOC_PLUGIN=/usr/bin/grpc_csharp_plugin &&
              dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact'
          sudo chown -R "$(id -u):$(id -g)" artifact
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apk"

      - name: Stage artifact
        run: mv artifact/BBDown artifact/BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}
          retention-days: 7

  pack:
    name: Pack .NET tool (nupkg)
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Pack
        # IsPackable 解决 Web SDK 默认禁用打包；PublishAot=false 避免打包时触发需 RID 的 AOT 原生编译
        run: dotnet pack BBDown -c ${{ env.BUILD_CONFIG }} -o nupkg -p:IsPackable=true -p:PublishAot=false

      - name: Upload nupkg
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_nupkg
          path: nupkg/*.nupkg
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux, build-linux-musl, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: BBDown_*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re

          ref = os.environ.get("GITHUB_REF", "")
          m = re.match(r"refs/tags/(.+)", ref)
          tag = m.group(1) if m else ""
          version = tag[1:] if tag.startswith("v") else tag

          with open("CHANGELOG.md", encoding="utf-8") as f:
              lines = f.read().splitlines()

          esc = re.escape(version)
          pat = re.compile(r"^##\s+(?:\[)?" + esc + r"(?:\])?(?:\s*-\s*\S+)?\s*$")
          start = None
          for i, line in enumerate(lines):
              if pat.match(line):
                  start = i
                  break

          found = False
          body_lines = []
          if start is not None:
              # 去掉版本号外的链接方括号，便于在 Release 正文里干净渲染
              heading = re.sub(r"^##\s+\[([^\]]+)\]", r"## \1", lines[start])
              body_lines.append(heading)
              for line in lines[start + 1:]:
                  # 遇到下一个二级标题或文件底部的链接引用定义即停止
                  if re.match(r"^##\s+", line) or re.match(r"^\[[^\]]+\]:", line):
                      break
                  body_lines.append(line)
              found = True

          body = "\n".join(body_lines).strip() + "\n"
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"found={str(found).lower()}\n")
              f.write(f"version={version}\n")
          print(f"version={version} found={found}")
          PY

      - name: Create GitHub Release (from CHANGELOG)
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: release_notes.md

      - name: Create GitHub Release (auto-generated notes)
        if: steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
