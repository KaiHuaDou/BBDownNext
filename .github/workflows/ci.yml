name: Build & Test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: "9.0.316"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  BUILD_CONFIG: Release

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Run tests with coverage
        run: dotnet test --configuration ${{ env.BUILD_CONFIG }} --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --verbosity minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    needs: [test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        shell: pwsh
        run: mv artifact/BBDown.exe BBDown-${{ matrix.rid }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.rid }})
    needs: [test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        run: mv artifact/BBDown BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact
          retention-days: 7

  build-linux:
    name: Build Linux (${{ matrix.rid }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      # AOT 交叉编译（含 musl / arm64）由 PublishAotClang 提供 musl sysroot、静态 libz 与 objcopy，
      # 复用 runner 自带的 clang，无需 Alpine 容器或交叉工具链 apt 安装。
      - name: Publish (AOT)
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        run: mv artifact/BBDown BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact
          retention-days: 7

  pack:
    name: Pack .NET tool (nupkg)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Pack
        # IsPackable 解决 Web SDK 默认禁用打包；PublishAot=false 避免打包时触发需 RID 的 AOT 原生编译
        run: dotnet pack BBDown -c ${{ env.BUILD_CONFIG }} -o nupkg -p:IsPackable=true -p:PublishAot=false

      - name: Upload nupkg
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_nupkg
          path: nupkg/*.nupkg
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: BBDown_*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
