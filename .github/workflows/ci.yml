name: Build & Test

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/gui.yml"
      - "BBDown.GUI/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/gui.yml"
      - "BBDown.GUI/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  BUILD_CONFIG: Release

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Run tests with coverage
        # 显式指定测试项目，排除 BBDown.GUI（WPF 无测试，且 slnx 会一并构建它）
        # 走 Microsoft Testing Platform：dotnet test 的构建/主机参数（如 --configuration、--verbosity）在 -- 之前，
        # 测试平台参数（--coverage、--report-trx）在 -- 之后
        run: |
          dotnet test BBDown.Tests/BBDown.Tests.csproj --configuration ${{ env.BUILD_CONFIG }} --verbosity minimal -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --report-trx --report-trx-filename test-results.trx
          dotnet test BBDown.Core.Tests/BBDown.Core.Tests.csproj --configuration ${{ env.BUILD_CONFIG }} --verbosity minimal -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --report-trx --report-trx-filename test-results.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/TestResults/*.log
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          retention-days: 7

      - name: Report coverage to job summary
        if: always()
        shell: bash
        run: |
          PYCMD=$(command -v python3 || command -v python)
          "$PYCMD" - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          files = sorted(glob.glob("**/TestResults/**/coverage.cobertura.xml", recursive=True))
          lines = ["## Coverage (line-rate)"]
          if not files:
              lines.append("no coverage file found")
          for f in files:
              try:
                  rate = float(ET.parse(f).getroot().get("line-rate", "0"))
              except Exception:
                  rate = 0.0
              lines.append(f"- {f}: {rate*100:.1f}%")
          text = "\n".join(lines) + "\n"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(text)
          print(text, end="")
          PY

  build-webui:
    name: Build WebUI (dist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: BBDown.WebUI/pnpm-lock.yaml

      - name: Install
        working-directory: BBDown.WebUI
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: BBDown.WebUI
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: BBDown.WebUI/dist
          retention-days: 7

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    needs: [test, build-webui]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # YY-Thunks / VC-LTL 仅支持 win-x64/x86，且 Win7 无 arm64，故仅 x64 追加 Win7 兼容产物
          - rid: win-x64
            buildWin7: true
          - rid: win-arm64
            buildWin7: false
    steps:
      - uses: actions/checkout@v7

      - name: Download WebUI dist
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: BBDown.WebUI/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        shell: pwsh
        run: mv artifact/BBDown.exe artifact/BBDown-${{ matrix.rid }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}.exe
          retention-days: 7

      - name: Publish (Win7 compatible)
        if: matrix.buildWin7
        run: dotnet publish BBDown -r win-x64 -c ${{ env.BUILD_CONFIG }} -o artifact-win7 -p:Win7Compatitable=true

      - name: Stage artifact (Win7 compatible)
        if: matrix.buildWin7
        shell: pwsh
        run: mv artifact-win7/BBDown.exe artifact-win7/BBDown-win7-x64.exe

      - name: Upload artifact (Win7 compatible)
        if: matrix.buildWin7
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_win7_x64
          path: artifact-win7/BBDown-win7-x64.exe
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.rid }})
    needs: [test, build-webui]
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Download WebUI dist
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: BBDown.WebUI/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        run: mv artifact/BBDown artifact/BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}
          retention-days: 7

  build-linux:
    name: Build Linux (glibc) (${{ matrix.rid }})
    needs: [test, build-webui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download WebUI dist
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: BBDown.WebUI/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      # linux-arm64 在原生 arm64 runner 上构建，避免 x64 交叉编译需额外工具链。
      # GitHub arm64 runner 未预装 clang，且 .NET AOT 剥离符号需要 aarch64-linux-gnu-objcopy。
      - name: Cache apt archives (arm64)
        if: matrix.rid == 'linux-arm64'
        uses: actions/cache@v6
        with:
          path: ~/.apt-cache/archives
          key: apt-arm64-aot-v2-${{ hashFiles('Directory.Packages.props') }}

      - name: Install native AOT tools (arm64)
        if: matrix.rid == 'linux-arm64'
        run: |
          mkdir -p "$HOME/.apt-cache/archives"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/.apt-cache/archives" clang binutils-aarch64-linux-gnu zlib1g-dev
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.apt-cache"

      - name: Publish (AOT)
        run: dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact

      - name: Stage artifact
        run: mv artifact/BBDown artifact/BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}
          retention-days: 7

  build-linux-musl:
    name: Build Linux (musl) (${{ matrix.rid }})
    needs: [test, build-webui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            runner: ubuntu-latest
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download WebUI dist
        uses: actions/download-artifact@v7
        with:
          name: webui-dist
          path: BBDown.WebUI/dist

      # musl 目标在 Alpine 容器内按宿主架构原生编译。宿主 Ubuntu 既无 musl sysroot，
      # 其 ld.bfd 也不支持 aarch64；交叉链接要么直接失败，要么悄悄链到 glibc 产出假 musl 二进制。
      # 用 docker run 而非 job 级 container，避免 Actions runner 注入的 glibc node 在 musl 容器内跑不起来。
      # 镜像 tag 里的 alpine 版本需与 global.json 的 SDK 版本一同升级，否则 docker pull 会直接报 manifest unknown。
      - name: Resolve SDK version from global.json
        id: sdkver
        shell: bash
        run: echo "version=$(grep -m 1 -o '"version"\s*:\s*"[^"]*"' global.json | sed 's/.*:\s*"//;s/"//')" >> "$GITHUB_OUTPUT"

      - name: Cache apk packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apk
          key: apk-musl-${{ steps.sdkver.outputs.version }}

      - name: Publish (AOT in Alpine)
        run: |
          docker run --rm -v "$PWD":/src -v "$HOME/.cache/apk":/var/cache/apk -w /src \
            mcr.microsoft.com/dotnet/sdk:${{ steps.sdkver.outputs.version }}-alpine3.23 sh -c '
              apk add clang build-base zlib-dev protobuf grpc-plugins &&
              export PROTOBUF_PROTOC=/usr/bin/protoc &&
              export GRPC_PROTOC_PLUGIN=/usr/bin/grpc_csharp_plugin &&
              dotnet publish BBDown -r ${{ matrix.rid }} -c ${{ env.BUILD_CONFIG }} -o artifact'
          sudo chown -R "$(id -u):$(id -g)" artifact
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apk"

      - name: Stage artifact
        run: mv artifact/BBDown artifact/BBDown-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}
          path: artifact/BBDown-${{ matrix.rid }}
          retention-days: 7

  pack:
    name: Pack .NET tool (nupkg)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Pack
        # IsPackable 解决 Web SDK 默认禁用打包；PublishAot=false 避免打包时触发需 RID 的 AOT 原生编译
        run: dotnet pack BBDown -c ${{ env.BUILD_CONFIG }} -o nupkg -p:IsPackable=true -p:PublishAot=false

      - name: Upload nupkg
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_nupkg
          path: nupkg/*.nupkg
          retention-days: 7
