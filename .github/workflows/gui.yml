name: GUI Build & Publish

on:
  push:
    branches: ["main"]
    paths:
      - "BBDown.GUI/**"
      - ".github/workflows/gui.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  BUILD_CONFIG: Release

jobs:
  build-windows:
    name: Build GUI (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish (framework-dependent)
        run: dotnet publish BBDown.GUI -c ${{ env.BUILD_CONFIG }} -r ${{ matrix.rid }} --self-contained false -o artifact-fd

      - name: Stage artifact (framework-dependent)
        shell: pwsh
        run: mv artifact-fd/BBDown.GUI.exe artifact-fd/BBDown.GUI-${{ matrix.rid }}-fd.exe

      - name: Upload artifact (framework-dependent)
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_GUI_${{ matrix.rid }}_fd
          path: artifact-fd/BBDown.GUI-${{ matrix.rid }}-fd.exe
          retention-days: 7

      - name: Publish (self-contained)
        run: dotnet publish BBDown.GUI -c ${{ env.BUILD_CONFIG }} -r ${{ matrix.rid }} --self-contained true -o artifact-sc

      - name: Stage artifact (self-contained)
        shell: pwsh
        run: mv artifact-sc/BBDown.GUI.exe artifact-sc/BBDown.GUI-${{ matrix.rid }}-sc.exe

      - name: Upload artifact (self-contained)
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_GUI_${{ matrix.rid }}_sc
          path: artifact-sc/BBDown.GUI-${{ matrix.rid }}-sc.exe
          retention-days: 7

  attach-to-latest-release:
    name: Attach to latest release
    if: github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: BBDown_GUI_*
          merge-multiple: true

      - name: Get latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$tag" ]; then
            echo "no release found"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.latest.outputs.tag }}" artifacts/* --clobber
