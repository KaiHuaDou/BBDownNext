name: GUI Build & Publish

on:
  push:
    branches: ["main"]
    paths:
      - "BBDown.GUI/**"
      - ".github/workflows/gui.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  BUILD_CONFIG: Release

jobs:
  build-windows:
    name: Build GUI (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish (AOT)
        run: dotnet publish BBDown.GUI -c ${{ env.BUILD_CONFIG }} -r ${{ matrix.rid }} -o artifact

      # AOT 单文件发布仍会伴随无法嵌入的原生库（如 libSkiaSharp，具体文件名随依赖变化），
      # 故打包整个发布目录为 zip，避免漏掉这些伴随文件。
      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path artifact\* -DestinationPath BBDown.GUI-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_GUI_${{ matrix.rid }}
          path: BBDown.GUI-${{ matrix.rid }}.zip
          retention-days: 7

  build-macos:
    name: Build GUI (${{ matrix.rid }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      - name: Publish (AOT)
        run: dotnet publish BBDown.GUI -c ${{ env.BUILD_CONFIG }} -r ${{ matrix.rid }} -o artifact

      # AOT 单文件发布仍会伴随无法嵌入的原生库（如 libSkiaSharp，具体文件名随依赖变化），
      # 故打包整个发布目录为 zip，避免漏掉这些伴随文件。
      - name: Package artifact
        run: cd artifact && zip -r "../BBDown.GUI-${{ matrix.rid }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_GUI_${{ matrix.rid }}
          path: BBDown.GUI-${{ matrix.rid }}.zip
          retention-days: 7

  build-linux:
    name: Build GUI (glibc) (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          cache: true
          cache-dependency-path: "**/Directory.Packages.props"

      # linux-arm64 在原生 arm64 runner 上构建，避免 x64 交叉编译需额外工具链。
      # GitHub arm64 runner 未预装 clang，且 .NET AOT 剥离符号需要 aarch64-linux-gnu-objcopy。
      - name: Cache apt archives (arm64)
        if: matrix.rid == 'linux-arm64'
        uses: actions/cache@v6
        with:
          path: ~/.apt-cache/archives
          key: apt-arm64-aot-v2-${{ hashFiles('Directory.Packages.props') }}

      - name: Install native AOT tools (arm64)
        if: matrix.rid == 'linux-arm64'
        run: |
          mkdir -p "$HOME/.apt-cache/archives"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/.apt-cache/archives" clang binutils-aarch64-linux-gnu zlib1g-dev
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.apt-cache"

      - name: Publish (AOT)
        run: dotnet publish BBDown.GUI -c ${{ env.BUILD_CONFIG }} -r ${{ matrix.rid }} -o artifact

      # AOT 单文件发布仍会伴随无法嵌入的原生库（如 libSkiaSharp，具体文件名随依赖变化），
      # 故打包整个发布目录为 zip，避免漏掉这些伴随文件。
      - name: Package artifact
        run: cd artifact && zip -r "../BBDown.GUI-${{ matrix.rid }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_GUI_${{ matrix.rid }}
          path: BBDown.GUI-${{ matrix.rid }}.zip
          retention-days: 7

  attach-to-latest-release:
    name: Attach to latest release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: BBDown_GUI_*
          merge-multiple: true

      - name: Get latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$tag" ]; then
            echo "no release found"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.latest.outputs.tag }}" artifacts/* --clobber
